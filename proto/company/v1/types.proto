syntax = "proto3";

package company.v1;

option go_package = "github.com/StudJobs/proto_srtucture/gen/go/proto/company/v1";

import "proto/common/v1/types.proto";

message CompanyType {
  string value = 1;
}

message Company {
  string id = 1;
  string name = 2;
  string description = 3;
  string city = 4;
  string site = 5;
  CompanyType type = 6;
  string logo_id = 7;

  // Политика авточистки: каждые N часов (default 6) фоновый воркер в
  // Vacancy/MicroTasks soft-удаляет (deleted_at = NOW()) closed/completed
  // записи компании старше этих дней. 0 = не чистить.
  int32 cleanup_vacancies_after_days = 8;  // closed-вакансии старше N дней
  int32 cleanup_tasks_after_days = 9;      // completed-микрозадачи старше N дней
}

message CompanyList {
  repeated Company companies = 1;
  common.v1.PaginationResponse pagination = 2;
}
