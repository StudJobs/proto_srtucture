syntax = "proto3";

package achievement.v1;

option go_package = "github.com/StudJobs/proto_srtucture/gen/go/proto/achievement/v1";

// ============ DATA MESSAGES ============

// Тип достижения в портфолио студента
enum AchievementType {
  ACHIEVEMENT_TYPE_UNSPECIFIED = 0;  // По умолчанию (неклассифицированное)
  ACHIEVEMENT_TYPE_PET_PROJECT = 1;  // Пет-проект
  ACHIEVEMENT_TYPE_COURSEWORK = 2;   // Курсовая работа
  ACHIEVEMENT_TYPE_HACKATHON = 3;    // Хакатон
  ACHIEVEMENT_TYPE_COURSE = 4;       // Курс / сертификат
  ACHIEVEMENT_TYPE_MICROTASK_RESULT = 5; // Результат микрозадачи
  ACHIEVEMENT_TYPE_OTHER = 6;        // Иное
  ACHIEVEMENT_TYPE_SKILL_VERIFICATION = 7; // Заявка студента на подтверждение конкретного навыка
}

// Статус экспертной верификации портфолио
enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_DRAFT = 1;     // Черновик (только что загружено, не отправлено на ревью)
  VERIFICATION_STATUS_PENDING = 2;   // Ожидает экспертной проверки
  VERIFICATION_STATUS_APPROVED = 3;  // Подтверждено экспертом
  VERIFICATION_STATUS_REJECTED = 4;  // Отклонено экспертом
}

// Метаданные достижения
message AchievementMeta {
  string name = 1;           // Уникальное имя достижения (в рамках пользователя)
  string user_uuid = 2;      // UUID владельца достижения
  string file_name = 3;      // Оригинальное имя файла
  string file_type = 4;      // MIME-тип файла (например, "image/jpeg", "application/pdf")
  int64 file_size = 5;       // Размер файла в байтах
  string created_at = 6;     // Дата создания в формате RFC3339
  AchievementType type = 7;  // Тип ачивки (пет-проект / курсовая / хакатон / курс / итог микрозадачи)

  // Поля экспертной верификации
  int64 id = 8;                                   // Числовой ID записи (для ревью эксперта)
  VerificationStatus verification_status = 9;     // Текущий статус верификации
  string reviewed_by = 10;                        // UUID эксперта, провёл ревью (пусто если ещё не ревьюилось)
  string reviewed_at = 11;                        // Время ревью в RFC3339 (пусто если не ревьюилось)
  string review_comment = 12;                     // Комментарий эксперта (опционально)

  // Дополнительные материалы от студента (ссылки на репозиторий / демо /
  // презентацию / скриншоты). Эксперт видит это поле в очереди проверки.
  string external_url = 13;                       // Опциональная URL-ссылка
  string description = 14;                        // Описание / контекст работы (max 1024 chars)
  string skill_slug = 15;                         // Для SKILL_VERIFICATION — slug подтверждаемого навыка
}

// Список метаданных достижений
message AchievementList {
  repeated AchievementMeta achievements = 1; // Массив достижений пользователя
}

// Ответ с URL для операций с файлами
message AchievementUrl {
  string url = 1;           // Presigned URL для загрузки/скачивания
  int64 expires_at = 2;     // Время истечения срока действия URL (Unix timestamp)
}

// Ответ с URL для загрузки
message UploadUrlResponse {
  string upload_url = 1;    // Presigned URL для загрузки
  string s3_key = 2;        // S3 ключ файла (нужен для AddAchievementMeta)
  int64 expires_at = 3;     // Время истечения срока действия URL
}