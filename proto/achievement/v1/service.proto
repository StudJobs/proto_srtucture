syntax = "proto3";

package achievement.v1;

option go_package = "github.com/StudJobs/proto_srtucture/gen/go/proto/achievement/v1";

import "proto/achievement/v1/types.proto";
import "proto/common/v1/types.proto";

service AchievementService {
  // Получить все достижения пользователя (только метаданные)
  rpc GetAllAchievements(GetAllAchievementsRequest) returns (AchievementList);

  // Получить URL для скачивания достижения (просмотра)
  rpc GetAchievementDownloadUrl(GetAchievementRequest) returns (AchievementUrl);

  // Получить URL для загрузки файла достижения (presigned URL)
  rpc GetAchievementUploadUrl(GetAchievementUploadRequest) returns (UploadUrlResponse);

  // Добавить метаданные достижения после успешной загрузки в S3
  rpc AddAchievementMeta(AddAchievementMetaRequest) returns (common.v1.Empty);

  // Удалить достижение (метаданные + файл из S3)
  rpc DeleteAchievement(DeleteAchievementRequest) returns (common.v1.Empty);

  // Студент отправляет своё достижение на ревью (DRAFT -> PENDING)
  rpc SubmitForReview(SubmitForReviewRequest) returns (common.v1.Empty);

  // Эксперт получает очередь достижений в статусе PENDING
  rpc GetExpertQueue(GetExpertQueueRequest) returns (AchievementList);

  // Эксперт принимает решение: APPROVED или REJECTED + комментарий
  rpc ReviewAchievement(ReviewAchievementRequest) returns (common.v1.Empty);

  // F5: автоматическое создание ачивки в портфолио после approve микрозадачи.
  // Создаётся сразу в статусе APPROVED, type=MICROTASK_RESULT.
  // Идемпотентно по (user_uuid, microtask_id) — повторный вызов при ретрае не дублирует.
  rpc CreateMicrotaskAchievement(CreateMicrotaskAchievementRequest) returns (common.v1.Empty);
}

// ============ REQUEST/RESPONSE MESSAGES ============

// Запрос на получение всех достижений пользователя
message GetAllAchievementsRequest {
  string user_uuid = 1; // UUID пользователя для фильтрации
}

// Запрос на получение конкретного достижения
message GetAchievementRequest {
  string user_uuid = 1;        // UUID пользователя (для проверки прав доступа)
  string achievement_name = 2; // Уникальное имя достижения в рамках пользователя
}

// Запрос на получение URL для загрузки файла в S3
message GetAchievementUploadRequest {
  string user_uuid = 1;        // UUID пользователя
  string achievement_name = 2; // Уникальное имя достижения
  string file_name = 3;        // Оригинальное имя файла
  string file_type = 4;        // MIME-тип файла
  int64 file_size = 5;         // Размер файла в байтах (для валидации)
}

// Запрос на добавление метаданных достижения
message AddAchievementMetaRequest {
  AchievementMeta meta = 1;    // Метаданные достижения
  string s3_key = 2;           // S3 ключ из UploadUrlResponse
}

// Запрос на удаление достижения
message DeleteAchievementRequest {
  string user_uuid = 1;        // UUID пользователя
  string achievement_name = 2; // Имя удаляемого достижения
}

// Запрос на отправку достижения на экспертную проверку
message SubmitForReviewRequest {
  string user_uuid = 1;        // UUID студента (владельца)
  int64 achievement_id = 2;    // Числовой ID достижения
}

// Запрос очереди эксперта (только PENDING)
message GetExpertQueueRequest {
  int32 page = 1;              // Страница (1-based)
  int32 limit = 2;             // Размер страницы (>=1)
}

// Запрос на ревью эксперта
message ReviewAchievementRequest {
  int64 achievement_id = 1;    // Числовой ID достижения
  string reviewer_uuid = 2;    // UUID эксперта
  VerificationStatus decision = 3; // Решение: APPROVED или REJECTED
  string comment = 4;          // Комментарий (особенно для REJECTED)
}

// F5: запрос на автосоздание ачивки после approve микрозадачи.
message CreateMicrotaskAchievementRequest {
  string user_uuid = 1;        // UUID студента (владельца ачивки)
  string microtask_id = 2;     // UUID микрозадачи (для дедупликации и трассировки)
  string microtask_title = 3;  // Заголовок задачи (для имени ачивки)
  string solution_url = 4;     // Ссылка на решение (попадёт в file_name)
  string reviewer_uuid = 5;    // UUID HR/компании, который approve'нул (попадёт в reviewed_by)
  string review_comment = 6;   // Комментарий ревьюера при approve (опционально)
}