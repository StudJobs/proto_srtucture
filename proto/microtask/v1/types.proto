syntax = "proto3";

package microtask.v1;

option go_package = "github.com/StudJobs/proto_srtucture/gen/go/proto/microtask/v1";

import "proto/common/v1/types.proto";

// Жизненный цикл микрозадачи на стороне HR/компании.
enum MicroTaskStatus {
  MICROTASK_STATUS_UNSPECIFIED = 0;
  MICROTASK_STATUS_OPEN = 1;        // Опубликована, доступна для apply студентами
  MICROTASK_STATUS_ASSIGNED = 2;    // Кто-то из студентов взял задачу
  MICROTASK_STATUS_COMPLETED = 3;   // HR принял solution
  MICROTASK_STATUS_CANCELLED = 4;   // HR закрыл задачу или истёк deadline
}

// Жизненный цикл submission'а от студента.
enum SubmissionStatus {
  SUBMISSION_STATUS_UNSPECIFIED = 0;
  SUBMISSION_STATUS_PENDING = 1;    // Студент отправил, ждёт ревью HR
  SUBMISSION_STATUS_APPROVED = 2;   // HR принял
  SUBMISSION_STATUS_REJECTED = 3;   // HR отклонил
}

message MicroTask {
  string id = 1;
  string company_id = 2;            // UUID компании-владельца задачи (для quest — UUID эксперта)
  string title = 3;
  string description = 4;           // Многострочное описание задачи
  int32 reward = 5;                 // Награда в рублях (опционально, может быть 0)
  string deadline = 6;              // ISO-дата дедлайна
  repeated string skill_slugs = 7;  // Slug-и нужных для решения навыков
  MicroTaskStatus status = 8;
  string assigned_to = 9;           // UUID студента, который взял задачу (если ASSIGNED+)
  string created_at = 10;
  string updated_at = 11;

  // Поля типа «квест от эксперта». Если is_skill_quest=true, задача создаётся
  // эксперт-ом для конкретного студента, исключается из публичной выдачи List,
  // и при approve добавляет target_skill_slug в verified_skill_slugs профиля.
  bool is_skill_quest = 12;
  string target_student_id = 13;
  string target_skill_slug = 14;
}

message MicroTaskList {
  repeated MicroTask tasks = 1;
  common.v1.PaginationResponse pagination = 2;
}

message Submission {
  string id = 1;
  string microtask_id = 2;
  string student_id = 3;
  string solution_url = 4;          // Ссылка на репо/файл с решением (если задана студентом)
  string comment = 5;               // Комментарий студента (опционально)
  SubmissionStatus status = 6;
  string review_comment = 7;        // Комментарий HR при approve/reject
  string submitted_at = 8;
  string reviewed_at = 9;
  string solution_file_name = 10;   // Имя загруженного файла (если был загружен через S3)
  string solution_file_url = 11;    // GET-presigned URL — заполняется при выдаче в API, не хранится в БД
}

message SubmissionList {
  repeated Submission submissions = 1;
  common.v1.PaginationResponse pagination = 2;
}
