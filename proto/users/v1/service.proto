syntax = "proto3";

package users.v1;

option go_package = "github.com/StudJobs/proto_srtucture/gen/go/proto/users/v1";

import "proto/users/v1/types.proto";
import "proto/common/v1/types.proto";

service UsersService {
  // Создать профиль
  rpc NewProfile(NewProfileRequest) returns (Profile);

  // Обновить профиль
  rpc UpdateProfile(UpdateProfileRequest) returns (Profile);

  // Удалить профиль
  rpc DeleteProfile(DeleteProfileRequest) returns (common.v1.Empty);

  // Получить профиль
  rpc GetProfile(GetProfileRequest) returns (Profile);

  // Получить все профили
  rpc GetAllProfiles(GetAllProfilesRequest) returns (ProfileList);

  // Добавить навыки в verified_skill_slugs профиля (union). Используется при approve
  // микрозадачи / квеста — навык фиксируется как подтверждённый.
  rpc AddVerifiedSkills(AddVerifiedSkillsRequest) returns (Profile);

  // Получить список тест-вопросов по навыку (для прохождения тестирования эксперта).
  rpc GetExpertiseTest(GetExpertiseTestRequest) returns (ExpertiseTest);

  // Отправить ответы на тест. Если процент правильных >= порог — навык
  // добавляется в expert_verified_skill_slugs профиля.
  rpc SubmitExpertiseTest(SubmitExpertiseTestRequest) returns (SubmitExpertiseTestResponse);
}

message NewProfileRequest {
  Profile profile = 1;
}

message UpdateProfileRequest {
  string id = 1; // UUID профиля
  Profile profile = 2;
}

message DeleteProfileRequest {
  string id = 1; // UUID профиля
}

message GetProfileRequest {
  string id = 1; // UUID профиля
}

message GetAllProfilesRequest {
  common.v1.Pagination pagination = 1;
  string profession_category = 2; // Опциональный фильтр по категории
  string role = 3;
}

message AddVerifiedSkillsRequest {
  string user_id = 1;
  repeated string skill_slugs = 2;
}

message GetExpertiseTestRequest {
  string skill_slug = 1;
}

message TestQuestion {
  int32 id = 1;          // порядковый номер
  string text = 2;       // формулировка вопроса
  repeated string options = 3; // варианты ответа
}

message ExpertiseTest {
  string skill_slug = 1;
  bool available = 2;        // если false — теста по навыку пока нет (вернётся reason)
  string reason = 3;
  repeated TestQuestion questions = 4;
  int32 pass_threshold_pct = 5; // например 70
}

message SubmitExpertiseTestRequest {
  string user_id = 1;
  string skill_slug = 2;
  // Ответы в виде map question_id -> chosen_option_index. Используем repeated parallel
  // для простоты с protobuf-runtime.
  repeated int32 answer_indices = 3;
}

message SubmitExpertiseTestResponse {
  bool passed = 1;
  int32 correct = 2;
  int32 total = 3;
  int32 score_pct = 4;
  string message = 5;
}